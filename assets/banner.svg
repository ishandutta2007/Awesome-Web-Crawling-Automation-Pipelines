<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dash 20s linear infinite;
    }
    .node-anim {
      animation: float 4s ease-in-out infinite alternate;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle Animated Grid Pattern in Background -->
  <g opacity="0.12">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#38bdf8" stroke-width="1"/>

    <line x1="150" y1="0" x2="150" y2="360" stroke="#818cf8" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="360" stroke="#818cf8" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="360" stroke="#818cf8" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="360" stroke="#818cf8" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="360" stroke="#818cf8" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="360" stroke="#818cf8" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="360" stroke="#818cf8" stroke-width="1"/>
  </g>

  <!-- Dynamic Background Pipeline Wave Paths -->
  <g opacity="0.35">
    <path class="flow-line" d="M-50,290 C300,180 500,340 850,220 C1050,150 1150,260 1250,200" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path class="flow-line" d="M-50,120 C250,250 600,110 900,280 C1080,350 1180,240 1250,270" fill="none" stroke="#a855f7" stroke-width="2"/>
  </g>

  <!-- Animated Glowing Background Nodes (Safe Behind Content) -->
  <g class="node-anim" opacity="0.5">
    <circle cx="1060" cy="90" r="60" fill="url(#glowGrad)" filter="url(#glow)"/>
    <circle cx="950" cy="270" r="80" fill="url(#glowGrad)" filter="url(#glow)"/>
    <circle cx="120" cy="280" r="70" fill="url(#glowGrad)" filter="url(#glow)"/>
  </g>

  <!-- Foreground Content Container -->
  <!-- Top Badge / Pill -->
  <g transform="translate(80, 52)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
    <circle cx="16" cy="16" r="5" fill="#38bdf8" class="pulse-circle"/>
    <text x="32" y="21" class="tag-text">DATA EXTRACTION &amp; PIPELINES</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="132" class="title-text">
    Awesome Web Crawling &amp; Automation
  </text>
  <text x="80" y="176" class="title-text" fill="url(#accentGrad)" style="fill:url(#accentGrad);">
    Pipelines Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="80" y="222" class="subtitle-text">
    Curated SaaS Platforms, Headless Browser Engines, AI Extraction Spiders &amp; Distributed Crawlers
  </text>

  <!-- Bottom Feature Badges / Highlights -->
  <g transform="translate(80, 268)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🕷️ Distributed Crawlers</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="195" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Headless Automation</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(405, 0)">
      <rect width="185" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🤖 AI Web Extraction</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(605, 0)">
      <rect width="195" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📊 ETL &amp; RAG Ingestion</text>
    </g>
  </g>
</svg>
